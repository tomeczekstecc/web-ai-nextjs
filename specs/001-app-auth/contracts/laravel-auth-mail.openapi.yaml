openapi: 3.1.0
info:
  title: Laravel Auth Mail Contract
  version: 0.1.0
  description: |
    Internal Laravel mail-delivery API used by the Next.js auth layer to send
    branded verification and password-reset emails while Better Auth retains
    token generation and validation authority.
paths:
  /auth/mail:
    post:
      summary: Deliver an auth email generated by the app auth layer
      parameters:
        - in: header
          name: X-Internal-Auth-Mail
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, email, callback_url]
              properties:
                type:
                  type: string
                  enum: [verify_email, reset_password]
                email:
                  type: string
                  format: email
                callback_url:
                  type: string
                  format: uri
                display_name:
                  type: string
                  nullable: true
      responses:
        '202':
          description: Mail accepted for delivery.
        '503':
          description: Mail delivery unavailable.
components: {}
