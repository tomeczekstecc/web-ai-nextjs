name: ci-prs-prod

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16.9-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-ci-prs}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=libc --locale=C.UTF-8
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 -p 5432",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Adminer ─────────────────────────────────────────────────────────────────
  adminer:
    image: adminer:4.8.1
    restart: unless-stopped
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8089}:8080"

  # ── Next.js web (standalone) ─────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_APP_NAME:       ${NEXT_PUBLIC_APP_NAME:-CI-PRS}
        NEXT_PUBLIC_SITE_URL:       ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
        NEXT_PUBLIC_API_URL:        ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_NAV_LAYOUT:     ${NEXT_PUBLIC_NAV_LAYOUT:-sidebar}
        NEXT_PUBLIC_TOAST_POSITION: ${NEXT_PUBLIC_TOAST_POSITION:-bottom-right}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT:     3600

      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-ci-prs}

      # better-auth
      BETTER_AUTH_URL:    ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}

      # External Laravel API (server-side SSR calls)
      API_URL: ${API_URL:?API_URL is required}

      # Laravel bridge tokens
      LARAVEL_INTERNAL_AUTH_TOKEN:        ${LARAVEL_INTERNAL_AUTH_TOKEN:?LARAVEL_INTERNAL_AUTH_TOKEN is required}
      LARAVEL_INTERNAL_AUTH_MAIL_TOKEN:   ${LARAVEL_INTERNAL_AUTH_MAIL_TOKEN:?LARAVEL_INTERNAL_AUTH_MAIL_TOKEN is required}
      LARAVEL_INTERNAL_AUTH_REVOKE_TOKEN: ${LARAVEL_INTERNAL_AUTH_REVOKE_TOKEN:?LARAVEL_INTERNAL_AUTH_REVOKE_TOKEN is required}

      # Auth flags — dev-only flags MUST remain false in production
      AUTH_SIGNUP_ENABLED:         ${AUTH_SIGNUP_ENABLED:-true}
      AUTH_SOCIAL_LOGIN_ENABLED:   ${AUTH_SOCIAL_LOGIN_ENABLED:-false}
      AUTH_LARAVEL_MOCK_ENABLED:   "false"
      AUTH_SESSION_BYPASS_ENABLED: "false"

    env_file:
      - path: .env.prod
        required: false   # optional; secrets can also be injected by CI/CD
    ports:
      - "127.0.0.1:${WEB_PORT:-3600}:3600"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3600',r=>process.exit(r.statusCode&&r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
